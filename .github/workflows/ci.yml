name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the Windows build as a prerelease with this tag (e.g. v0.1.0-wing-test.1)"
        required: false
        default: ""

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (debug)
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

  rust-tsan:
    name: Rust TSan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Test under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --lib --tests

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (ASIO + WASAPI)
            os: windows-2022
            artifact: Sidecar-Windows
            parallel: 4
          - name: macOS (CoreAudio)
            os: macos-14
            artifact: Sidecar-macOS
            parallel: 4
          - name: Linux (ALSA + JACK)
            os: ubuntu-24.04
            artifact: Sidecar-Linux
            parallel: 2   # two JUCE targets with LTO exhaust the runner's memory at higher counts

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/LiveDAW_artefacts/Release/Sidecar.exe" dist/
          Copy-Item README.md dist/
          Copy-Item resources/fonts/OFL.txt dist/FONT-LICENSE.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/LiveDAW_artefacts/Release/Sidecar.app" "dist/Sidecar.app.zip"
          cp README.md dist/
          cp resources/fonts/OFL.txt dist/FONT-LICENSE.txt

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "build/LiveDAW_artefacts/Release/Sidecar" dist/
          cp README.md dist/
          cp resources/fonts/OFL.txt dist/FONT-LICENSE.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ "address,undefined", "thread" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIVEDAW_SANITIZE=${{ matrix.sanitizer }}

      - name: Build tests
        run: cmake --build build --target LiveDAWTests --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/tests/tsan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        run: ./build/LiveDAWTests_artefacts/Debug/LiveDAWTests

  # Pushing a tag (e.g. v0.1.0-wing-test.1), or running the workflow by hand with a
  # release_tag, publishes the tested Windows build as a GitHub prerelease.
  release:
    name: Publish test release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [ build, rust, sanitizers ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sidecar-Windows
          path: Sidecar-Windows

      - name: Zip
        run: cd Sidecar-Windows && zip -r "../Sidecar-Windows-${TAG}.zip" .

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Test build of Sidecar for Windows 10/11 (64-bit), built and tested by CI from ${GITHUB_SHA::7}.

          **Install:** unzip and run \`Sidecar.exe\`. No installer and no runtime to install.
          The exe isn't code-signed, so Windows SmartScreen may warn; choose *More info > Run anyway*.

          **Audio:** ASIO (your interface's driver, ASIO4ALL or FlexASIO) and WASAPI.
          Choose the driver and device in SETUP > AUDIO.

          This is a test release of the Behringer WING emulation; see README.md in the zip.
          Sidecar is an independent hobby project, made for fun and practice. It is not
          affiliated with or endorsed by Behringer or Music Tribe; WING is their trademark.
          It tries hard to emulate the WING faithfully, but it is incomplete and can differ
          from the real console (the start-up notice lists how). Don't rely on it for a
          critical live show without testing it first.
          EOF
          # Creates the tag at the tested commit if it doesn't exist yet.
          gh release create "$TAG" "Sidecar-Windows-${TAG}.zip" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Sidecar ${TAG} (Windows test build)" --notes-file notes.md
