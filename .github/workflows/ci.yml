name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0 or v0.1.1-beta.2); empty: just build"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft (publish it by hand on GitHub)"
        type: boolean
        default: false

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (debug)
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

  rust-tsan:
    name: Rust TSan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Test under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --lib --tests

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (ASIO + WASAPI)
            os: windows-2022
            artifact: Sidecar-Windows
            parallel: 4
          - name: macOS (CoreAudio)
            os: macos-14
            artifact: Sidecar-macOS
            parallel: 4
          - name: Linux (ALSA + JACK)
            os: ubuntu-24.04
            artifact: Sidecar-Linux
            parallel: 2   # two JUCE targets with LTO exhaust the runner's memory at higher counts

    env:
      # Set for a release (workflow_dispatch with release_tag, or a v* tag push).
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2

      # A release stamps its tag into the app (LIVEDAW_VERSION) and the package names;
      # other builds keep CMake's default version and name the packages <version>-ci.<commit>.
      - name: Version
        shell: bash
        run: |
          default=$(sed -n 's/^set(LIVEDAW_DEFAULT_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?$ ]]; then
              echo "::error::release tag '$RELEASE_TAG' is not vMAJOR.MINOR.PATCH[-suffix]"
              exit 1
            fi
            version=${RELEASE_TAG#v}
            stamp=$RELEASE_TAG
          else
            version="${default:-0.0.0}-ci.${GITHUB_SHA::7}"
            stamp=""
          fi
          echo "Sidecar version: $version (stamp: '${stamp}')"
          echo "SIDECAR_VERSION=$version" >> "$GITHUB_ENV"
          echo "LIVEDAW_VERSION_STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DLIVEDAW_VERSION=${{ env.LIVEDAW_VERSION_STAMP }}"

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Corrosion can't build a universal Rust library, so the Intel slice is a second,
      # x86_64-only build (app only, reusing the fetched sources); the package step lipos
      # its executable into the arm64 app.
      - name: Build x86_64 slice (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-x64 -DCMAKE_BUILD_TYPE=Release -DLIVEDAW_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DRust_CARGO_TARGET=x86_64-apple-darwin \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_CORROSION="$PWD/build/_deps/corrosion-src" \
            "-DLIVEDAW_VERSION=${{ env.LIVEDAW_VERSION_STAMP }}"
          cmake --build build-x64 --config Release --target LiveDAW --parallel ${{ matrix.parallel }}
          lipo -info build-x64/LiveDAW_artefacts/Release/Sidecar.app/Contents/MacOS/Sidecar

      # Packages (packaging/): the release assets, also uploaded for every CI build.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1 -BuildDir build -Version $env:SIDECAR_VERSION -OutDir dist -Installer

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/package-macos.sh build/LiveDAW_artefacts/Release/Sidecar.app \
            build-x64/LiveDAW_artefacts/Release/Sidecar.app "$SIDECAR_VERSION" dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          # Pinned AppImage tools, checked against these SHA-256 sums.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  $tools/appimagetool" | sha256sum -c -
          echo "$APPIMAGE_RUNTIME_SHA256  $tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/appimagetool"
          APPIMAGETOOL="$tools/appimagetool" APPIMAGE_RUNTIME="$tools/runtime-x86_64" \
            bash packaging/package-linux.sh build "$SIDECAR_VERSION" dist

      - name: List packages
        shell: bash
        run: ls -la dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ "address,undefined", "thread" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIVEDAW_SANITIZE=${{ matrix.sanitizer }}

      - name: Build tests
        run: cmake --build build --target LiveDAWTests --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/tests/tsan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        run: ./build/LiveDAWTests_artefacts/Debug/LiveDAWTests

  # Running the workflow by hand with a release_tag (or pushing a v* tag) publishes
  # the tested packages of all three platforms as a GitHub release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [ build, rust, sanitizers ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Sidecar-*
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: python3 packaging/release_notes.py "$TAG" "$GITHUB_SHA" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          # Creates the tag at the tested commit if it doesn't exist yet.
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "Sidecar $TAG" --notes-file notes.md "${flags[@]}"
