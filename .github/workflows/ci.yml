name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (ALSA + JACK)
            os: ubuntu-24.04
          - name: macOS (CoreAudio)
            os: macos-14
          - name: Windows (ASIO + WASAPI)
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2   # real plugins for the hosting integration test

      - name: Fetch ASIO SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asio
          $dir = (Get-ChildItem asio -Directory | Select-Object -First 1).FullName
          "ASIO_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            ${ASIO_SDK_DIR:+-DLIVEDAW_ASIO_SDK_DIR="$ASIO_SDK_DIR"}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ "address,undefined", "thread" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            lsp-plugins-lv2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIVEDAW_SANITIZE=${{ matrix.sanitizer }}

      - name: Build tests
        run: cmake --build build --target LiveDAWTests --parallel

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        run: ./build/LiveDAWTests_artefacts/Debug/LiveDAWTests
