<!doctype html>
<!-- Sidecar's web remote: the screen mirror. Served by livedaw-web (src/http.rs);
     the protocol is described in src/screen.rs (frames) and src/input.rs (input). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Sidecar</title>
<style>
  :root { color-scheme: dark; --bar: 30px; --fg: #c8c8c8; --dim: #707070; --accent: #f0c419; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font: 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none; }
  #bar { position: fixed; left: 0; right: 0; top: 0; height: calc(var(--bar) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0;
    display: flex; align-items: center; gap: 12px; background: #111; border-bottom: 1px solid #222; z-index: 2; }
  #bar .name { font-weight: 600; letter-spacing: .08em; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #a33; flex: none; }
  #dot.on { background: #3b3; }
  #dot.wait { background: var(--accent); }
  #state, #stats { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats { font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  #bar button { background: #1d1d1d; color: var(--fg); border: 1px solid #333; border-radius: 4px; height: 22px; min-width: 30px;
    padding: 0 8px; font: inherit; font-size: 12px; cursor: pointer; }
  #bar button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  #bar button[hidden] { display: none; }
  #view { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar) + env(safe-area-inset-top)); overflow: hidden;
    touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; outline: none; touch-action: none; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.72); z-index: 3; }
  #overlay.show { display: flex; }
  #pinbox { background: #161616; border: 1px solid #333; border-radius: 8px; padding: 22px; width: min(300px, 90vw); text-align: center; }
  #pinbox h1 { font-size: 16px; letter-spacing: .1em; margin: 0 0 16px; font-weight: 600; }
  #pin { width: 100%; font-size: 26px; text-align: center; letter-spacing: .3em; padding: 8px; background: #000; color: #fff;
    border: 1px solid #444; border-radius: 4px; }
  #pinbox button { margin-top: 14px; width: 100%; height: 40px; font-size: 15px; background: var(--accent); color: #000; border: 0;
    border-radius: 4px; font-weight: 600; letter-spacing: .1em; }
  #pinmsg { min-height: 18px; margin-top: 12px; color: #e66; }
  #message { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--dim); font-size: 15px; letter-spacing: .1em;
    pointer-events: none; z-index: 1; }
</style>
</head>
<body>
<div id="bar">
  <span id="dot"></span><span class="name">SIDECAR</span><span id="state">CONNECTING</span>
  <span class="grow"></span>
  <span id="stats"></span>
  <button id="rclick" title="Next touch is a right-click">RIGHT</button>
  <button id="fit" title="Fit the screen (pinch or Ctrl+wheel zooms)">FIT</button>
  <button id="full" title="Full screen">FULL</button>
</div>
<div id="view"><canvas id="screen" tabindex="0" width="16" height="9"></canvas></div>
<div id="message">CONNECTING</div>
<div id="overlay"><form id="pinbox" autocomplete="off">
  <h1>SIDECAR PIN</h1>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
  <button type="submit">CONNECT</button>
  <div id="pinmsg"></div>
</form></div>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("screen"), ctx = canvas.getContext("2d"), view = $("view");
  const MSG_FRAME = 1, MSG_PONG = 2;
  const IN_POINTER = 1, IN_WHEEL = 2, IN_KEY = 3, IN_ACK = 4, IN_PING = 5;

  let ws = null, watching = false, viewOnly = false, retry = 500;
  let width = 0, height = 0;
  let frames = 0, bytes = 0, rtt = null, lastStats = performance.now();
  let drawing = Promise.resolve();

  // ---- connection ------------------------------------------------------------
  function setState(text, kind) {
    $("state").textContent = text;
    $("dot").className = kind || "";
  }

  function message(text) {
    $("message").textContent = text || "";
  }

  function connect() {
    setState("CONNECTING", "wait");
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.binaryType = "arraybuffer";
    ws.onmessage = (e) => (typeof e.data === "string" ? onText(e.data) : onBinary(e.data));
    ws.onclose = () => {
      watching = false;
      setState("DISCONNECTED");
      if (!width) message("SIDECAR IS NOT REACHABLE");
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 5000);
    };
  }

  function send(bytesOut) {
    if (ws && ws.readyState === 1 && watching) ws.send(bytesOut);
  }

  function onText(text) {
    let m;
    try { m = JSON.parse(text); } catch { return; }
    if (m.t === "hello") {
      retry = 500;
      viewOnly = !!m.viewOnly;
      if (m.pin) {
        const saved = sessionStorage.getItem("sidecar.pin");
        if (saved) ws.send("pin:" + saved);
        else askPin("");
      } else {
        started();
      }
    } else if (m.t === "ok") {
      $("overlay").classList.remove("show");
      sessionStorage.setItem("sidecar.pin", pendingPin || sessionStorage.getItem("sidecar.pin") || "");
      started();
    } else if (m.t === "wrong") {
      sessionStorage.removeItem("sidecar.pin");
      askPin("WRONG PIN");
    } else if (m.t === "wait") {
      sessionStorage.removeItem("sidecar.pin");
      askPin("TOO MANY TRIES. WAIT " + m.s + " S");
    }
  }

  function started() {
    watching = true;
    setState(viewOnly ? "VIEW ONLY" : "CONNECTED", "on");
    $("rclick").hidden = viewOnly;
    message("");
    ping();
  }

  let pendingPin = "";
  function askPin(error) {
    setState("PIN", "wait");
    $("pinmsg").textContent = error;
    $("overlay").classList.add("show");
    $("pin").value = "";
    $("pin").focus();
  }

  $("pinbox").addEventListener("submit", (e) => {
    e.preventDefault();
    pendingPin = $("pin").value.trim();
    $("pinmsg").textContent = "";
    if (ws && ws.readyState === 1) ws.send("pin:" + pendingPin);
  });

  // ---- frames ------------------------------------------------------------------
  function onBinary(buf) {
    const d = new DataView(buf);
    const type = d.getUint8(0);
    bytes += buf.byteLength;
    if (type === MSG_PONG) {
      rtt = performance.now() - d.getFloat64(1, true);
      return;
    }
    if (type !== MSG_FRAME) return;
    const seq = d.getUint32(1, true), w = d.getUint16(5, true), h = d.getUint16(7, true);
    const tile = d.getUint16(9, true), count = d.getUint16(11, true);
    const tiles = [];
    let o = 13;
    for (let i = 0; i < count; i++) {
      const col = d.getUint16(o, true), row = d.getUint16(o + 2, true), fmt = d.getUint8(o + 4), len = d.getUint32(o + 5, true);
      const blob = new Blob([new Uint8Array(buf, o + 9, len)], { type: fmt === 1 ? "image/jpeg" : "image/png" });
      tiles.push({ x: col * tile, y: row * tile, image: decode(blob) });
      o += 9 + len;
    }
    // Frames are drawn in order; each is acknowledged once drawn.
    drawing = drawing.then(async () => {
      if (w !== width || h !== height) resize(w, h);
      const images = await Promise.all(tiles.map((t) => t.image.catch(() => null)));
      images.forEach((img, i) => {
        if (!img) return;
        ctx.drawImage(img, tiles[i].x, tiles[i].y);
        if (img.close) img.close();
      });
      frames++;
      const ack = new Uint8Array(5);
      ack[0] = IN_ACK;
      new DataView(ack.buffer).setUint32(1, seq, true);
      send(ack);
    });
  }

  function decode(blob) {
    if (window.createImageBitmap) return createImageBitmap(blob);
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(blob);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  function resize(w, h) {
    width = w;
    height = h;
    canvas.width = w;
    canvas.height = h;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    fit();
  }

  function ping() {
    const m = new DataView(new ArrayBuffer(9));
    m.setUint8(0, IN_PING);
    m.setFloat64(1, performance.now(), true);
    send(m.buffer);
  }

  setInterval(() => {
    const now = performance.now(), s = (now - lastStats) / 1000;
    if (watching) {
      $("stats").textContent = (frames / s).toFixed(0) + " FPS  " + (bytes / s / 1024).toFixed(0) + " KB/S" +
        (rtt !== null ? "  " + rtt.toFixed(0) + " MS" : "");
      ping();
    } else {
      $("stats").textContent = "";
    }
    frames = 0;
    bytes = 0;
    lastStats = now;
  }, 1000);

  // ---- view: fit, pinch / Ctrl+wheel zoom and pan (in the page, not sent) ---------
  let zoom = 1, panX = 0, panY = 0, base = 1, originX = 0, originY = 0;

  function fit() {
    zoom = 1;
    panX = panY = 0;
    layout();
  }

  function layout() {
    if (!width) return;
    const vw = view.clientWidth, vh = view.clientHeight;
    base = Math.min(vw / width, vh / height);
    const s = base * zoom;
    // Keep the screen on the page: centred when smaller, edges clamped when bigger.
    const clamp = (pan, size, room) => (size <= room ? (room - size) / 2 : Math.min(0, Math.max(room - size, pan)));
    originX = clamp(panX, width * s, vw);
    originY = clamp(panY, height * s, vh);
    panX = originX;
    panY = originY;
    canvas.style.transform = "translate(" + originX + "px," + originY + "px) scale(" + s + ")";
  }

  function zoomAt(factor, clientX, clientY) {
    const r = view.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
    const old = base * zoom;
    zoom = Math.min(8, Math.max(1, zoom * factor));
    const s = base * zoom;
    panX = x - (x - originX) * (s / old);
    panY = y - (y - originY) * (s / old);
    layout();
  }

  window.addEventListener("resize", layout);
  $("fit").onclick = fit;

  // ---- input ---------------------------------------------------------------------
  function modifiers(e) {
    return (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
  }

  /** The point as fractions of the screen. */
  function where(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  }

  function sendPointer(action, buttons, mods, x, y) {
    if (viewOnly) return;
    const m = new DataView(new ArrayBuffer(12));
    m.setUint8(0, IN_POINTER);
    m.setUint8(1, action);
    m.setUint8(2, buttons);
    m.setUint8(3, mods);
    m.setFloat32(4, x, true);
    m.setFloat32(8, y, true);
    send(m.buffer);
  }

  const MOVE = 0, DOWN = 1, UP = 2, LEAVE = 3;

  // Mouse and pen: straight through. Touch: the first finger is the mouse
  // (its press waits a moment, so a second finger can still turn it into a
  // pinch); two fingers zoom and pan the page.
  const touches = new Map();
  let finger = null; // { id, sent, x, y, startX, startY, timer, buttons }
  let pinch = null;
  let rightClick = false;

  $("rclick").onclick = () => {
    rightClick = !rightClick;
    $("rclick").classList.toggle("active", rightClick);
  };

  function pressFinger() {
    if (!finger || finger.sent) return;
    clearTimeout(finger.timer);
    finger.sent = true;
    sendPointer(MOVE, 0, 0, finger.startX, finger.startY);
    sendPointer(DOWN, finger.buttons, 0, finger.startX, finger.startY);
    if (finger.x !== finger.startX || finger.y !== finger.startY) sendPointer(MOVE, finger.buttons, 0, finger.x, finger.y);
  }

  function startPinch() {
    const [a, b] = [...touches.values()];
    pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.focus({ preventScroll: true });
    e.preventDefault();
    if (e.pointerType !== "touch") {
      canvas.setPointerCapture(e.pointerId);
      const [x, y] = where(e);
      sendPointer(DOWN, e.buttons & 7, modifiers(e), x, y);
      return;
    }
    canvas.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 1) {
      const [x, y] = where(e);
      const buttons = rightClick ? 2 : 1;
      if (rightClick) $("rclick").click();
      finger = { id: e.pointerId, sent: false, x, y, startX: x, startY: y, buttons, timer: setTimeout(pressFinger, 90) };
    } else if (touches.size === 2) {
      if (finger) {
        clearTimeout(finger.timer);
        if (finger.sent) sendPointer(UP, 0, 0, finger.x, finger.y);
        finger = null;
      }
      startPinch();
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "touch") {
      const [x, y] = where(e);
      sendPointer(MOVE, e.buttons & 7, modifiers(e), x, y);
      return;
    }
    const t = touches.get(e.pointerId);
    if (!t) return;
    t.x = e.clientX;
    t.y = e.clientY;
    if (pinch && touches.size === 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      panX += cx - pinch.cx;
      panY += cy - pinch.cy;
      layout();
      if (pinch.dist > 0) zoomAt(dist / pinch.dist, cx, cy);
      pinch = { dist, cx, cy };
    } else if (finger && finger.id === e.pointerId) {
      [finger.x, finger.y] = where(e);
      const r = canvas.getBoundingClientRect();
      const moved = Math.hypot((finger.x - finger.startX) * r.width, (finger.y - finger.startY) * r.height);
      if (!finger.sent && moved > 6) pressFinger();
      else if (finger.sent) sendPointer(MOVE, finger.buttons, 0, finger.x, finger.y);
    }
  });

  function pointerEnd(e) {
    if (e.pointerType !== "touch") {
      const [x, y] = where(e);
      sendPointer(UP, e.buttons & 7, modifiers(e), x, y);
      return;
    }
    touches.delete(e.pointerId);
    if (finger && finger.id === e.pointerId) {
      if (e.type === "pointerup") pressFinger(); // a quick tap
      if (finger.sent) sendPointer(UP, 0, 0, finger.x, finger.y);
      finger = null;
    }
    if (touches.size < 2) pinch = null;
  }

  canvas.addEventListener("pointerup", pointerEnd);
  canvas.addEventListener("pointercancel", pointerEnd);
  canvas.addEventListener("pointerleave", (e) => {
    if (e.pointerType === "mouse" && !e.buttons) sendPointer(LEAVE, 0, 0, 0, 0);
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault()); // Safari's own pinch

  // Wheel: Ctrl+wheel (and trackpad pinch) zooms the page; the rest goes to
  // Sidecar as one wheel step per notch (smooth scrolling is added up).
  let wheelX = 0, wheelY = 0;
  view.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
      zoomAt(Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.002)), e.clientX, e.clientY);
      return;
    }
    if (viewOnly) return;
    const unit = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 1 : 1 / 100;
    wheelX += e.deltaX * unit;
    wheelY += e.deltaY * unit;
    const step = (v) => (v >= 1 ? 1 : v <= -1 ? -1 : 0);
    const [x, y] = where(e);
    for (let sx = step(wheelX), sy = step(wheelY); sx || sy; sx = step(wheelX), sy = step(wheelY)) {
      wheelX -= sx;
      wheelY -= sy;
      const m = new DataView(new ArrayBuffer(18));
      m.setUint8(0, IN_WHEEL);
      m.setUint8(1, modifiers(e));
      m.setFloat32(2, x, true);
      m.setFloat32(6, y, true);
      m.setFloat32(10, -sx * 50 / 256, true);
      m.setFloat32(14, -sy * 50 / 256, true);
      send(m.buffer);
    }
  }, { passive: false });

  // Keys, while the screen has the focus. The browser keeps its own reload,
  // full screen and developer keys.
  const KEYS = { Enter: -1, Escape: -2, Backspace: -3, Tab: -4, Delete: -5, ArrowLeft: -6, ArrowRight: -7, ArrowUp: -8,
    ArrowDown: -9, Home: -10, End: -11, PageUp: -12, PageDown: -13, Insert: -14 };
  for (let i = 1; i <= 12; i++) KEYS["F" + i] = -20 - i;

  function keyCode(e) {
    if (e.key in KEYS) return KEYS[e.key];
    if ([...e.key].length === 1) return e.key.codePointAt(0);
    return 0;
  }

  function onKey(e, down) {
    if (viewOnly || !watching) return;
    if (["F5", "F11", "F12"].includes(e.key)) return;
    if ((e.ctrlKey || e.metaKey) && ["r", "l", "t", "w", "n", "q"].includes(e.key.toLowerCase())) return;
    const code = keyCode(e);
    if (!code) return;
    e.preventDefault();
    const m = new DataView(new ArrayBuffer(7));
    m.setUint8(0, IN_KEY);
    m.setUint8(1, down ? 1 : 0);
    m.setUint8(2, modifiers(e));
    m.setInt32(3, code, true);
    send(m.buffer);
  }

  canvas.addEventListener("keydown", (e) => onKey(e, true));
  canvas.addEventListener("keyup", (e) => onKey(e, false));

  // ---- full screen ---------------------------------------------------------------
  const root = document.documentElement;
  const requestFull = root.requestFullscreen || root.webkitRequestFullscreen;
  $("full").hidden = !requestFull;
  $("full").onclick = () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else requestFull.call(root);
  };

  connect();
})();
</script>
</body>
</html>
