[package]
name = "livedaw-wing"
description = "Behringer WING interoperability for Sidecar: the WING parameter tree mapped onto the engine, Discovery/OSC/Native remote servers and WING snapshot files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
livedaw-dsp = { path = "../livedaw-dsp" }
livedaw-engine = { path = "../livedaw-engine" }
livedaw-session = { path = "../livedaw-session" }

# The settings parser and the render path have unit tests (run by `cargo test`).
[[example]]
name = "render"
test = true
